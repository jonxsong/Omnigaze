<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Omnigaze end-to-end architecture</title>
  <desc id="diagram-desc">An architecture diagram showing browser and MCP clients entering a Next.js application, deterministic market intelligence and guarded AI services, Alpaca and fail-closed SEC provider boundaries, Cloudflare D1 storage, scheduled jobs, alerts, and observability.</desc>
  <defs>
    <filter id="paper-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#172033" flood-opacity="0.10"/>
    </filter>
    <filter id="rough-line" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="23" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.75" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4 L0,8 Z" fill="#263247"/>
    </marker>
    <style>
      .canvas { fill: #fbfaf7; }
      .frame { fill: none; stroke: #d5d0c5; stroke-width: 2; }
      .zone { stroke: #263247; stroke-width: 2.5; filter: url(#paper-shadow); }
      .rough { filter: url(#rough-line); }
      .inner { stroke: #344158; stroke-width: 2; }
      .ghost { fill: none; stroke: #263247; stroke-width: 1.4; opacity: 0.14; }
      .flow { fill: none; stroke: #263247; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .optional { stroke-dasharray: 11 9; }
      .eyebrow { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.5px; fill: #59657a; }
      .title { font: 750 35px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .subtitle { font: 500 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #59657a; }
      .zone-title { font: 750 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .box-title { font: 720 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .body { font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #344158; }
      .small { font: 500 12.5px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4d5a70; }
      .micro { font: 650 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #46536a; }
      .pill { stroke: #55637a; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1050" rx="28"/>
  <rect class="frame rough" x="13" y="13" width="1574" height="1024" rx="22"/>

  <text class="eyebrow" x="50" y="51">OMNIGAZE · CONTROLLED BETA</text>
  <text class="title" x="50" y="89">Evidence in. Decisions explained. Boundaries stay honest.</text>
  <text class="subtitle" x="50" y="118">One typed domain model across the dashboard, HTTP API, MCP tools, deterministic analytics, and guarded AI.</text>

  <!-- Experiences -->
  <g transform="rotate(-0.12 800 187)">
    <rect class="zone rough" x="350" y="142" width="900" height="112" rx="18" fill="#e7f4ec"/>
    <rect class="ghost rough" x="353" y="145" width="894" height="106" rx="16"/>
    <text class="eyebrow" x="374" y="166">EXPERIENCES</text>

    <rect class="inner rough" x="378" y="179" width="392" height="52" rx="12" fill="#f5fcf7"/>
    <circle cx="402" cy="205" r="10" fill="#78c697" stroke="#263247" stroke-width="1.8"/>
    <text class="box-title" x="421" y="202">Web dashboard</text>
    <text class="small" x="421" y="219">Bilingual onboarding · watchlists · holdings</text>

    <rect class="inner rough" x="830" y="179" width="392" height="52" rx="12" fill="#f5fcf7"/>
    <path d="M855 195 h18 v17 h-10 l-6 6 v-6 h-2 z" fill="#78c697" stroke="#263247" stroke-width="1.8" stroke-linejoin="round"/>
    <text class="box-title" x="884" y="202">ChatGPT + MCP clients</text>
    <text class="small" x="884" y="219">The same reads and owner-scoped mutations</text>
  </g>

  <!-- Provider boundary -->
  <g transform="rotate(0.18 172 496)">
    <rect class="zone rough" x="42" y="292" width="260" height="410" rx="18" fill="#fff0d9"/>
    <rect class="ghost rough" x="45" y="295" width="254" height="404" rx="16"/>
    <text class="eyebrow" x="66" y="321">PROVIDER BOUNDARY</text>

    <rect class="inner rough" x="68" y="346" width="208" height="126" rx="14" fill="#fffaf1"/>
    <circle cx="94" cy="373" r="10" fill="#f0ad55" stroke="#263247" stroke-width="1.8"/>
    <text class="box-title" x="113" y="379">Alpaca</text>
    <text class="body" x="88" y="407">Quotes + bars</text>
    <text class="body" x="88" y="429">Asset catalog + news</text>
    <text class="micro" x="88" y="453">REST polling · current</text>

    <rect class="inner rough" x="68" y="506" width="208" height="158" rx="14" fill="#fff7f3"/>
    <path d="M87 532 h18 v18 h-18 z M91 532 v-5 h10 v5" fill="none" stroke="#c8664c" stroke-width="2.2" stroke-linecap="round"/>
    <text class="box-title" x="113" y="543">SEC EDGAR</text>
    <text class="body" x="88" y="574">Recent filings cursor</text>
    <text class="body" x="88" y="596">D1 fair-access coordinator</text>
    <rect class="pill" x="88" y="613" width="164" height="28" rx="14" fill="#ffe1d9"/>
    <text class="micro" x="102" y="632">FAIL-CLOSED · OPT-IN</text>
    <text class="small" x="88" y="654">Zero egress until activated</text>
  </g>

  <!-- Application platform -->
  <g>
    <rect class="zone rough" x="350" y="292" width="900" height="586" rx="20" fill="#e9f0ff"/>
    <rect class="ghost rough" x="353" y="295" width="894" height="580" rx="18"/>
    <text class="eyebrow" x="376" y="322">OPENAI SITES · CLOUDFLARE WORKER</text>
    <text class="zone-title" x="376" y="348">Next.js application and shared domain services</text>

    <!-- Gateway -->
    <g transform="rotate(-0.10 800 401)">
      <rect class="inner rough" x="385" y="370" width="830" height="76" rx="14" fill="#f8fbff"/>
      <text class="box-title" x="412" y="399">Typed application boundary</text>
      <text class="body" x="412" y="423">Next.js API routes · MCP 2026-07-28 · strict Zod parsers · owner identity · no-store reads</text>
      <rect class="pill" x="1059" y="387" width="126" height="30" rx="15" fill="#d8e6ff"/>
      <text class="micro" x="1079" y="407">HTTP + MCP</text>
    </g>

    <!-- Unified read plane -->
    <g transform="rotate(0.12 573 536)">
      <rect class="inner rough" x="385" y="476" width="375" height="132" rx="14" fill="#edf8ff"/>
      <text class="box-title" x="410" y="505">Unified intelligence read plane</text>
      <text class="body" x="410" y="532">Normalize · hash · deduplicate</text>
      <text class="body" x="410" y="554">Merge request-time + durable receipts</text>
      <text class="body" x="410" y="576">Freshness, source, delay, coverage</text>
      <text class="micro" x="410" y="596">FIXTURES NEVER BECOME LIVE</text>
    </g>

    <!-- Deterministic services -->
    <g transform="rotate(-0.15 1005 536)">
      <rect class="inner rough" x="800" y="476" width="415" height="132" rx="14" fill="#fff7da"/>
      <text class="box-title" x="826" y="505">Deterministic market + portfolio layer</text>
      <text class="body" x="826" y="532">Snapshots · charts · Market Pulse</text>
      <text class="body" x="826" y="554">Portfolio Pulse · scenario math</text>
      <text class="body" x="826" y="576">Move Lens · SPY/QQQ comparisons</text>
      <text class="micro" x="826" y="596">FIXED-POINT · NO TRADE EXECUTION</text>
    </g>

    <!-- Guarded AI -->
    <g transform="rotate(-0.08 573 710)">
      <rect class="inner rough" x="385" y="642" width="375" height="150" rx="14" fill="#f2eaff"/>
      <text class="box-title" x="410" y="671">Guarded AI views</text>
      <text class="body" x="410" y="698">OpenAI Agents SDK + typed output</text>
      <text class="body" x="410" y="720">Known evidence IDs only</text>
      <text class="body" x="410" y="742">Owner budget lease + bounded cache</text>
      <rect class="pill" x="410" y="755" width="189" height="24" rx="12" fill="#e4d6fb"/>
      <text class="micro" x="423" y="772">MANUAL · AUTHENTICATED</text>
    </g>

    <!-- Inbox -->
    <g transform="rotate(0.14 1005 710)">
      <rect class="inner rough" x="800" y="642" width="415" height="150" rx="14" fill="#e6f8f3"/>
      <text class="box-title" x="826" y="671">Personalization + intelligence inbox</text>
      <text class="body" x="826" y="698">Watchlists · holdings · Today view</text>
      <text class="body" x="826" y="720">Read / saved / dismissed state</text>
      <text class="body" x="826" y="742">Explicit alert rules + delivery ledger</text>
      <rect class="pill" x="826" y="755" width="202" height="24" rx="12" fill="#cfeee6"/>
      <text class="micro" x="839" y="772">IN-APP DELIVERY ONLY</text>
    </g>

    <rect class="pill rough" x="385" y="822" width="830" height="34" rx="17" fill="#dce7fb"/>
    <text class="micro" x="488" y="844">CANONICAL SYMBOLS · STRICT SCHEMAS · PROVENANCE · FRESHNESS · SAFE DEGRADATION</text>
  </g>

  <!-- Operations -->
  <g transform="rotate(-0.10 1427 535)">
    <rect class="zone rough" x="1293" y="292" width="264" height="586" rx="18" fill="#f0efec"/>
    <rect class="ghost rough" x="1296" y="295" width="258" height="580" rx="16"/>
    <text class="eyebrow" x="1318" y="321">OPERATIONS</text>

    <rect class="inner rough" x="1318" y="348" width="214" height="162" rx="14" fill="#fbfaf7"/>
    <path d="M1340 374 a13 13 0 1 0 26 0 a13 13 0 1 0 -26 0 M1353 365 v10 l7 5" fill="none" stroke="#58677c" stroke-width="2.2" stroke-linecap="round"/>
    <text class="box-title" x="1377" y="380">Hosted schedule</text>
    <text class="body" x="1338" y="410">Operator-only bounded ticks</text>
    <text class="body" x="1338" y="432">News cursor · SEC cursor</text>
    <text class="body" x="1338" y="454">Owner inbox projection</text>
    <rect class="pill" x="1338" y="470" width="170" height="24" rx="12" fill="#e6e3dd"/>
    <text class="micro" x="1352" y="487">VERIFY BEFORE CLAIMING</text>

    <rect class="inner rough" x="1318" y="548" width="214" height="286" rx="14" fill="#fbfaf7"/>
    <text class="box-title" x="1338" y="578">Operational confidence</text>
    <text class="body" x="1338" y="610">Health + capability probes</text>
    <text class="body" x="1338" y="634">Privacy-bounded telemetry</text>
    <text class="body" x="1338" y="658">Request IDs + timing</text>
    <line x1="1338" y1="681" x2="1508" y2="681" stroke="#b8b5ae" stroke-width="1.5"/>
    <text class="body" x="1338" y="710">TypeScript + ESLint</text>
    <text class="body" x="1338" y="734">Vitest contracts</text>
    <text class="body" x="1338" y="758">Playwright journeys</text>
    <text class="body" x="1338" y="782">Build + migration gates</text>
    <text class="micro" x="1338" y="813">DEPLOYMENT IS SEPARATE</text>
  </g>

  <!-- Durable state -->
  <g transform="rotate(0.08 800 964)">
    <rect class="zone rough" x="350" y="916" width="900" height="103" rx="18" fill="#dff4f1"/>
    <rect class="ghost rough" x="353" y="919" width="894" height="97" rx="16"/>
    <text class="eyebrow" x="376" y="944">CLOUDFLARE D1 · OWNER-SCOPED DURABLE STATE</text>
    <text class="box-title" x="376" y="976">Evidence + cursors</text>
    <text class="small" x="376" y="997">receipts · revisions · checkpoints</text>
    <text class="box-title" x="654" y="976">Product state</text>
    <text class="small" x="654" y="997">watchlists · holdings · inbox · alerts</text>
    <text class="box-title" x="978" y="976">AI guard state</text>
    <text class="small" x="978" y="997">bounded cache · budget reservations</text>
  </g>

  <!-- Request and data-flow arrows -->
  <path class="flow" d="M575 254 L575 286"/>
  <path class="flow" d="M1025 254 L1025 286"/>
  <path class="flow" d="M575 446 L575 471"/>
  <path class="flow" d="M1010 446 L1010 471"/>
  <path class="flow" d="M760 542 L794 542"/>
  <path class="flow" d="M575 608 L575 637"/>
  <path class="flow" d="M1010 608 L1010 637"/>
  <path class="flow" d="M302 410 L347 410 L347 520 L380 520"/>
  <path class="flow optional" d="M302 585 L335 585 L335 565 L380 565"/>
  <path class="flow" d="M575 912 L575 884"/>
  <path class="flow" d="M1010 912 L1010 884"/>
  <path class="flow optional" d="M1290 420 L1267 420 L1267 405 L1220 405"/>
  <path class="flow" d="M1253 736 L1288 736"/>

  <!-- Compact legend -->
  <g transform="translate(55 742)">
    <text class="eyebrow" x="0" y="0">FLOW LEGEND</text>
    <path class="flow" d="M0 28 L72 28"/>
    <text class="small" x="88" y="33">Request / verified data flow</text>
    <path class="flow optional" d="M0 62 L72 62"/>
    <text class="small" x="88" y="67">Scheduled or explicitly enabled</text>
  </g>

  <text class="small" x="50" y="1030">Current boundary: research support only · no brokerage import · no autonomous trading · provider and model secrets stay server-side</text>
</svg>
